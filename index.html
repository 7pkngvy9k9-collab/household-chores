<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Household chores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=4" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="config.js?v=4"></script>
  </head>
  <body>
    <div id="app"><p class="empty">Loading…</p></div>
    <script>
      window.addEventListener("error", (event) => {
        const root = document.getElementById("app");
        if (!root || root.dataset.rendered) return;
        root.innerHTML = `<p class="empty">Could not start the app: ${
          event.message || "script error"
        }</p>`;
      });
    </script>
    <script src="app.js?v=4"></script>
  </body>
</html>
